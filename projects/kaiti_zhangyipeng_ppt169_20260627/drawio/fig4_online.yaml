meta:
  theme: tech-blue
  layout: vertical
  canvas: 1180x680
  routing: orthogonal
  source: generated
  title: "图4 在线社交仿真系统架构"
  font:
    primary: Microsoft YaHei
    cjk: Microsoft YaHei
    formula: Cambria Math

nodes:
  # ===== 启动（顶部居中） =====
  - id: launch
    label: "main.py · multiprocessing 双进程启动"
    type: terminal
    bounds: { x: 410, y: 40, width: 360, height: 50 }
    style: { fillColor: "#1B3A5B", strokeColor: "#1B3A5B", fontColor: "#FFFFFF", strokeWidth: 2, fontSize: 14, bold: true }

  # ===== Backend 进程（左列，x=80） =====
  - id: band_backend
    label: "Backend 进程 · FastAPI :8000"
    type: text
    bounds: { x: 80, y: 150, width: 360, height: 26 }
    style: { fontColor: "#1B3A5B", fontSize: 15, bold: true, align: left, verticalAlign: middle }
  - id: be_api
    label: "REST API 路由\nlogin · feed · posts · comments · time"
    type: service
    bounds: { x: 80, y: 188, width: 300, height: 64 }
    style: { fillColor: "#E7EEF5", strokeColor: "#1B3A5B", fontColor: "#1B3A5B", strokeWidth: 2, fontSize: 12 }
  - id: be_rec
    label: "SocialRecSys 推荐服务\nW_CHRONO · W_BELIEF · W_POP · W_RAND"
    type: service
    bounds: { x: 80, y: 284, width: 300, height: 64 }
    style: { fillColor: "#E7EEF5", strokeColor: "#1B3A5B", fontColor: "#1B3A5B", strokeWidth: 2, fontSize: 12 }
  - id: be_time
    label: "时间服务 + 内容管理\n模拟时钟 · 持久化"
    type: service
    bounds: { x: 80, y: 380, width: 300, height: 64 }
    style: { fillColor: "#E7EEF5", strokeColor: "#1B3A5B", fontColor: "#1B3A5B", strokeWidth: 2, fontSize: 12 }
  - id: be_embed
    label: "SentenceTransformer 嵌入\nall-MiniLM-L6-v2"
    type: process
    bounds: { x: 80, y: 476, width: 300, height: 60 }
    style: { fillColor: "#E3EAF1", strokeColor: "#4A6B8A", fontColor: "#2C4257", strokeWidth: 2, fontSize: 12 }
  - id: be_db
    label: "SQLite + sqlite-vec\nmoss.db · 向量存储"
    type: database
    bounds: { x: 120, y: 568, width: 220, height: 80 }
    style: { fillColor: "#4A6B8A", strokeColor: "#1B3A5B", fontColor: "#FFFFFF", strokeWidth: 2, fontSize: 13, bold: true }

  # ===== Agent 进程（右列，x=800） =====
  - id: band_agent
    label: "Agent 进程 · 决策循环"
    type: text
    bounds: { x: 800, y: 150, width: 300, height: 26 }
    style: { fontColor: "#7A5E1A", fontSize: 15, bold: true, align: left, verticalAlign: middle }
  - id: ag_graph
    label: "AgentGraph 调度\n遍历已配置 Agent · agents.csv"
    type: process
    bounds: { x: 800, y: 188, width: 300, height: 64 }
    style: { fillColor: "#F6EDD6", strokeColor: "#C8A24B", fontColor: "#7A5E1A", strokeWidth: 2, fontSize: 12 }
  - id: ag_decide
    label: "决策循环\n发帖 / 评论 / 点赞 / 转发 / 引用"
    type: process
    bounds: { x: 800, y: 284, width: 300, height: 64 }
    style: { fillColor: "#F6EDD6", strokeColor: "#C8A24B", fontColor: "#7A5E1A", strokeWidth: 2, fontSize: 12 }
  - id: ag_mem
    label: "记忆系统\n检索 · 提示词构建"
    type: process
    bounds: { x: 800, y: 380, width: 300, height: 64 }
    style: { fillColor: "#F6EDD6", strokeColor: "#C8A24B", fontColor: "#7A5E1A", strokeWidth: 2, fontSize: 12 }
  - id: ag_llm
    label: "LangChain ChatOpenAI\n大模型 / 小模型分层驱动"
    type: cloud
    bounds: { x: 800, y: 472, width: 300, height: 72 }
    style: { fillColor: "#C8A24B", strokeColor: "#1B3A5B", fontColor: "#FFFFFF", strokeWidth: 2, fontSize: 13, bold: true }

  # ===== 归档（底部右） =====
  - id: archive
    label: "runs/<运行ID>/  归档\nmoss.db · backend.log · agent.log · snapshot.json"
    type: document
    bounds: { x: 760, y: 568, width: 380, height: 80 }
    style: { fillColor: "#EFEAE0", strokeColor: "#8C8C82", fontColor: "#5A5A52", strokeWidth: 2, fontSize: 12 }

edges:
  - { from: launch, to: be_api, type: primary, label: "启动 Backend", style: { strokeColor: "#1B3A5B", strokeWidth: 2 } }
  - { from: launch, to: ag_graph, type: primary, label: "健康检查后启动", style: { strokeColor: "#C8A24B", strokeWidth: 2 } }
  - { from: be_api, to: be_rec, type: primary, style: { strokeColor: "#1B3A5B", strokeWidth: 2 } }
  - { from: be_rec, to: be_time, type: primary, style: { strokeColor: "#1B3A5B", strokeWidth: 2 } }
  - { from: be_time, to: be_embed, type: primary, style: { strokeColor: "#4A6B8A", strokeWidth: 2 } }
  - { from: be_embed, to: be_db, type: data, style: { strokeColor: "#4A6B8A", strokeWidth: 2 } }
  - { from: ag_graph, to: ag_decide, type: primary, style: { strokeColor: "#C8A24B", strokeWidth: 2 } }
  - { from: ag_decide, to: ag_mem, type: primary, style: { strokeColor: "#C8A24B", strokeWidth: 2 } }
  - { from: ag_mem, to: ag_llm, type: data, style: { strokeColor: "#C8A24B", strokeWidth: 2 } }
  - { from: ag_decide, to: be_rec, type: bidirectional, label: "HTTP 调用 / Feed 拉取", style: { strokeColor: "#B24A38", strokeWidth: 2 } }
  - { from: be_db, to: archive, type: data, label: "归档", style: { strokeColor: "#8C8C82", strokeWidth: 2, dashed: true } }
