meta:
  theme: tech-blue
  layout: horizontal
  canvas: 1320x620
  routing: orthogonal
  source: generated
  title: "图5 数据流转时序：离线校准 → 配置中枢 → 在线仿真（单向贯通）"
  font:
    primary: Microsoft YaHei
    cjk: Microsoft YaHei
    formula: Cambria Math

nodes:
  # ===== 阶段标题 =====
  - id: t_offline
    label: "离线阶段（一次性校准）"
    type: text
    bounds: { x: 60, y: 56, width: 360, height: 26 }
    style: { fontColor: "#1B3A5B", fontSize: 15, bold: true, align: left, verticalAlign: middle }
  - id: t_hub
    label: "配置中枢"
    type: text
    bounds: { x: 560, y: 56, width: 230, height: 26 }
    style: { fontColor: "#7A5E1A", fontSize: 15, bold: true, align: center, verticalAlign: middle }
  - id: t_online
    label: "在线阶段（仿真运行）"
    type: text
    bounds: { x: 1000, y: 56, width: 280, height: 26 }
    style: { fontColor: "#2C4257", fontSize: 15, bold: true, align: left, verticalAlign: middle }

  # ===== 离线链（左列，纵向） =====
  - id: d1
    label: "① 原始数据\nuser / post · 内容观测 Excel"
    type: document
    bounds: { x: 60, y: 110, width: 230, height: 66 }
    style: { fillColor: "#E7EEF5", strokeColor: "#1B3A5B", fontColor: "#1B3A5B", strokeWidth: 2, fontSize: 12 }
  - id: d2
    label: "② 用户画像生成\n五阶段 LLM · 影响力分层\nportraits/*.json"
    type: process
    bounds: { x: 60, y: 240, width: 230, height: 80 }
    style: { fillColor: "#E7EEF5", strokeColor: "#1B3A5B", fontColor: "#1B3A5B", strokeWidth: 2, fontSize: 12 }
  - id: d3
    label: "③ ABM 参数校准\n种群合成 · 向量化仿真\nEM / Optuna 拟合真实传播"
    type: process
    bounds: { x: 60, y: 384, width: 230, height: 80 }
    style: { fillColor: "#F6EDD6", strokeColor: "#C8A24B", fontColor: "#7A5E1A", strokeWidth: 2, fontSize: 12 }

  # ===== 真实观测：放到 d3 正下方，脱离主干路径 =====
  - id: real
    label: "真实传播观测\n（repost / view 比率）"
    type: document
    bounds: { x: 60, y: 510, width: 230, height: 60 }
    style: { fillColor: "#FFFFFF", strokeColor: "#B24A38", fontColor: "#B24A38", strokeWidth: 1.5, fontSize: 11 }

  # ===== 配置中枢（居中偏下，避开 d2→o2 水平线） =====
  - id: hub
    label: "calibration_profile.yaml\n离线→在线唯一配置接口\n四维权重 · decay_lambda"
    type: database
    bounds: { x: 545, y: 384, width: 250, height: 120 }
    style: { fillColor: "#C8A24B", strokeColor: "#1B3A5B", fontColor: "#FFFFFF", strokeWidth: 2.5, fontSize: 12, bold: true }

  # ===== 在线链（右列，纵向） =====
  - id: o1
    label: "④ SocialRecSys.configure()\n注入推荐参数 · Feed 排序"
    type: service
    bounds: { x: 1030, y: 110, width: 240, height: 66 }
    style: { fillColor: "#E3EAF1", strokeColor: "#4A6B8A", fontColor: "#2C4257", strokeWidth: 2, fontSize: 12 }
  - id: o2
    label: "⑤ Agent 模拟运行\n人格驱动 · 发帖/评论/点赞/转发"
    type: service
    bounds: { x: 1030, y: 240, width: 240, height: 80 }
    style: { fillColor: "#E3EAF1", strokeColor: "#4A6B8A", fontColor: "#2C4257", strokeWidth: 2, fontSize: 12 }
  - id: o3
    label: "⑥ runs/ 运行归档（终点）\n指标评估 · 消融实验"
    type: document
    bounds: { x: 1030, y: 384, width: 240, height: 66 }
    style: { fillColor: "#EFEAE0", strokeColor: "#8C8C82", fontColor: "#5A5A52", strokeWidth: 2, fontSize: 12 }

edges:
  # 离线主链（纵向）
  - { from: d1, to: d2, type: primary, style: { strokeColor: "#1B3A5B", strokeWidth: 2 } }
  - { from: d2, to: d3, type: data, label: "种群合成", style: { strokeColor: "#1B3A5B", strokeWidth: 2 } }
  # 真实观测 → ABM（自下而上，纵向，不横穿主干）
  - { from: real, to: d3, type: data, label: "拟合目标", style: { strokeColor: "#B24A38", strokeWidth: 1.5, dashed: true } }
  # ABM → 中枢（右出，d3 在 hub 左下，走折线进入 hub 底部）
  - { from: d3, to: hub, type: data, label: "写入校准参数", style: { strokeColor: "#C8A24B", strokeWidth: 2.5, dashed: true } }
  # 中枢 → 在线推荐
  - { from: hub, to: o1, type: data, label: "参数注入", style: { strokeColor: "#C8A24B", strokeWidth: 2.5, dashed: true } }
  # 画像第二条下游：人格模板直接注入在线 Agent（d2 在左上，o2 在右中）
  - { from: d2, to: o2, type: data, label: "人格模板注入", style: { strokeColor: "#1B3A5B", strokeWidth: 2, dashed: true } }
  # 在线主链（纵向）
  - { from: o1, to: o2, type: primary, style: { strokeColor: "#4A6B8A", strokeWidth: 2 } }
  - { from: o2, to: o3, type: primary, label: "结果归档", style: { strokeColor: "#4A6B8A", strokeWidth: 2 } }
