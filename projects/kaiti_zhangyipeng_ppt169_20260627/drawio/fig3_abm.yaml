meta:
  theme: tech-blue
  layout: horizontal
  canvas: 1180x560
  routing: orthogonal
  source: generated
  title: "图3 ABM 推荐参数校准模块设计"
  font:
    primary: Microsoft YaHei
    cjk: Microsoft YaHei
    formula: Cambria Math

nodes:
  # ===== 阶段标题 =====
  - id: band_in
    label: "输入与准备"
    type: text
    bounds: { x: 60, y: 80, width: 300, height: 28 }
    style: { fontColor: "#1B3A5B", fontSize: 15, bold: true, align: left, verticalAlign: middle }
  - id: band_sim
    label: "仿真与约束"
    type: text
    bounds: { x: 470, y: 80, width: 300, height: 28 }
    style: { fontColor: "#7A5E1A", fontSize: 15, bold: true, align: left, verticalAlign: middle }
  - id: band_out
    label: "校准与输出"
    type: text
    bounds: { x: 880, y: 80, width: 280, height: 28 }
    style: { fontColor: "#2C4257", fontSize: 15, bold: true, align: left, verticalAlign: middle }

  # ===== 输入与准备列（左，x=60） =====
  - id: in_data
    label: "画像与观测数据\n用户画像 · 真实传播观测指标"
    type: document
    bounds: { x: 60, y: 130, width: 300, height: 64 }
    style: { fillColor: "#E7EEF5", strokeColor: "#1B3A5B", fontColor: "#1B3A5B", strokeWidth: 2, fontSize: 12 }
  - id: in_sem
    label: "语义特征整理\n价值立场 · 内容主题 · 兴趣匹配"
    type: process
    bounds: { x: 60, y: 244, width: 300, height: 64 }
    style: { fillColor: "#E3EAF1", strokeColor: "#4A6B8A", fontColor: "#2C4257", strokeWidth: 2, fontSize: 12 }
  - id: in_pop
    label: "种群内容合成\nZipf 影响力分布 · 精英保留扩展"
    type: process
    bounds: { x: 60, y: 358, width: 300, height: 64 }
    style: { fillColor: "#E3EAF1", strokeColor: "#4A6B8A", fontColor: "#2C4257", strokeWidth: 2, fontSize: 12 }

  # ===== 仿真与约束列（中，x=470） =====
  - id: sim_engine
    label: "向量化仿真引擎\n批量计算用户—内容匹配分数\n生成候选传播结果"
    type: process
    bounds: { x: 470, y: 150, width: 300, height: 90 }
    style: { fillColor: "#F6EDD6", strokeColor: "#C8A24B", fontColor: "#7A5E1A", strokeWidth: 2, fontSize: 12 }
  - id: sim_rule
    label: "传播机制约束\n时间衰减 · 热度权重 · Soft Backfire\n归一化与边界控制"
    type: process
    bounds: { x: 470, y: 300, width: 300, height: 90 }
    style: { fillColor: "#F6EDD6", strokeColor: "#C8A24B", fontColor: "#7A5E1A", strokeWidth: 2, fontSize: 12 }

  # ===== 校准与输出列（右，x=880） =====
  - id: out_em
    label: "参数校准（EM）\nE 步估计内容传播概率\nM 步搜索全局权重 w_i / w_pop / w_time / w_rand"
    type: process
    bounds: { x: 880, y: 150, width: 280, height: 90 }
    style: { fillColor: "#E3EAF1", strokeColor: "#1B3A5B", fontColor: "#2C4257", strokeWidth: 2, fontSize: 12 }
  - id: out_yaml
    label: "校准配置输出\n推荐权重 · 衰减系数 · 诊断指标\n写入 calibration_profile.yaml"
    type: database
    bounds: { x: 880, y: 300, width: 280, height: 90 }
    style: { fillColor: "#C8A24B", strokeColor: "#1B3A5B", fontColor: "#FFFFFF", strokeWidth: 2.5, fontSize: 12, bold: true }

edges:
  - { from: in_data, to: in_sem, type: primary, style: { strokeColor: "#1B3A5B", strokeWidth: 2 } }
  - { from: in_sem, to: in_pop, type: primary, style: { strokeColor: "#4A6B8A", strokeWidth: 2 } }
  - { from: in_pop, to: sim_engine, type: data, label: "种群输入", style: { strokeColor: "#1B3A5B", strokeWidth: 2 } }
  - { from: sim_engine, to: sim_rule, type: primary, style: { strokeColor: "#C8A24B", strokeWidth: 2 } }
  - { from: sim_rule, to: out_em, type: data, label: "拟合误差", style: { strokeColor: "#C8A24B", strokeWidth: 2 } }
  - { from: out_em, to: out_yaml, type: primary, style: { strokeColor: "#1B3A5B", strokeWidth: 2.5 } }
  - { from: out_em, to: sim_engine, type: data, label: "多轮迭代校准", style: { strokeColor: "#B24A38", strokeWidth: 2, dashed: true } }
