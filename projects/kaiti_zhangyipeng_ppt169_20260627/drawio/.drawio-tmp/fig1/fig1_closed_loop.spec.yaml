meta:
  theme: tech-blue
  layout: horizontal
  canvas: 1280x760
  routing: orthogonal
  title: 图1 MOSS 数据—校准—运行闭环总览
  font:
    primary: Microsoft YaHei
    cjk: Microsoft YaHei
    formula: Cambria Math
modules:
  - id: m_offline
    label: 离线数据层
    color: '#1B3A5B'
  - id: m_calib
    label: 离线校准层
    color: '#C8A24B'
  - id: m_online
    label: 在线运行层
    color: '#4A6B8A'
nodes:
  - id: raw
    label: |-
      原始社交数据
      user / post 表
      内容观测 Excel
    type: document
    module: m_offline
    bounds:
      x: 60
      'y': 110
      width: 220
      height: 80
    style:
      fillColor: '#E7EEF5'
      strokeColor: '#1B3A5B'
      fontColor: '#1B3A5B'
      strokeWidth: 2
      rounded: 1
  - id: portrait_gen
    label: |-
      用户画像生成
      统计特征 + 证据帖
      五阶段 LLM 流水线
    type: process
    module: m_offline
    bounds:
      x: 60
      'y': 250
      width: 220
      height: 80
    style:
      fillColor: '#E7EEF5'
      strokeColor: '#1B3A5B'
      fontColor: '#1B3A5B'
      strokeWidth: 2
      rounded: 1
  - id: portrait_json
    label: |-
      portraits/*.json
      influence_tier
      profile_mode
    type: document
    module: m_offline
    bounds:
      x: 60
      'y': 390
      width: 220
      height: 80
    style:
      fillColor: '#E7EEF5'
      strokeColor: '#1B3A5B'
      fontColor: '#1B3A5B'
      strokeWidth: 2
      rounded: 1
  - id: semantic
    label: |-
      语义处理与种群合成
      Kernel PCA 立场轴
      Zipf 影响力分布扩展
    type: process
    module: m_calib
    bounds:
      x: 530
      'y': 110
      width: 240
      height: 80
    style:
      fillColor: '#F6EDD6'
      strokeColor: '#C8A24B'
      fontColor: '#7A5E1A'
      strokeWidth: 2
      rounded: 1
  - id: abm
    label: |-
      向量化 ABM + EM/Optuna
      四维推荐权重
      decay_lambda
    type: process
    module: m_calib
    bounds:
      x: 530
      'y': 250
      width: 240
      height: 80
    style:
      fillColor: '#F6EDD6'
      strokeColor: '#C8A24B'
      fontColor: '#7A5E1A'
      strokeWidth: 2
      rounded: 1
  - id: yaml
    label: |-
      calibration_profile.yaml
      单一配置中枢
    type: database
    module: m_calib
    bounds:
      x: 540
      'y': 400
      width: 220
      height: 80
    style:
      fillColor: '#C8A24B'
      strokeColor: '#1B3A5B'
      fontColor: '#FFFFFF'
      strokeWidth: 2
  - id: main
    label: |-
      main.py 双进程启动
      Backend + Agent
    type: process
    module: m_online
    bounds:
      x: 1010
      'y': 110
      width: 210
      height: 80
    style:
      fillColor: '#E3EAF1'
      strokeColor: '#4A6B8A'
      fontColor: '#2C4257'
      strokeWidth: 2
      rounded: 1
  - id: recsys
    label: |-
      SocialRecSys.configure()
      注入推荐参数
      Feed 排序
    type: service
    module: m_online
    bounds:
      x: 1010
      'y': 250
      width: 210
      height: 80
    style:
      fillColor: '#E3EAF1'
      strokeColor: '#4A6B8A'
      fontColor: '#2C4257'
      strokeWidth: 2
      rounded: 1
  - id: agent_run
    label: |-
      Agent 模拟运行
      发帖/评论/点赞/转发
      记忆与即时检索
    type: service
    module: m_online
    bounds:
      x: 1010
      'y': 390
      width: 210
      height: 80
    style:
      fillColor: '#E3EAF1'
      strokeColor: '#4A6B8A'
      fontColor: '#2C4257'
      strokeWidth: 2
      rounded: 1
  - id: runs
    label: |-
      runs/ 运行归档
      指标评估与消融实验
    type: document
    module: m_online
    bounds:
      x: 1010
      'y': 530
      width: 210
      height: 76
    style:
      fillColor: '#EFEAE0'
      strokeColor: '#8C8C82'
      fontColor: '#5A5A52'
      strokeWidth: 2
      rounded: 1
edges:
  - from: raw
    to: portrait_gen
    type: primary
    style:
      strokeColor: '#1B3A5B'
      strokeWidth: 2
  - from: portrait_gen
    to: portrait_json
    type: primary
    style:
      strokeColor: '#1B3A5B'
      strokeWidth: 2
  - from: semantic
    to: abm
    type: primary
    style:
      strokeColor: '#C8A24B'
      strokeWidth: 2
  - from: abm
    to: yaml
    type: primary
    style:
      strokeColor: '#C8A24B'
      strokeWidth: 2
  - from: portrait_json
    to: semantic
    type: data
    label: 画像注入
    style:
      strokeColor: '#1B3A5B'
      strokeWidth: 2
  - from: yaml
    to: recsys
    type: primary
    label: 参数注入
    style:
      strokeColor: '#C8A24B'
      strokeWidth: 2.5
  - from: main
    to: recsys
    type: primary
    style:
      strokeColor: '#4A6B8A'
      strokeWidth: 2
  - from: recsys
    to: agent_run
    type: primary
    style:
      strokeColor: '#4A6B8A'
      strokeWidth: 2
  - from: agent_run
    to: runs
    type: primary
    style:
      strokeColor: '#4A6B8A'
      strokeWidth: 2
  - from: runs
    to: yaml
    type: data
    label: 误差分析 / 下一轮校准
    style:
      strokeColor: '#B24A38'
      strokeWidth: 2
      dashed: true
