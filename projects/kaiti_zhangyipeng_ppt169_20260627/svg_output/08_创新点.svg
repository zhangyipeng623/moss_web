<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowTL" cx="0%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#1B3A5B" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#1B3A5B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B3A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="100%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#C8A24B" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#C8A24B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect width="1280" height="720" fill="url(#bgGlowTL)"/>
    <rect width="1280" height="720" fill="url(#bgGlowBR)"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">03 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">研究目标与创新点</tspan></text>
    <image href="../images/cuc_logo.png" x="1176" y="36" width="40" height="52" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">创新点：方法、闭环、架构三重递进</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 三条编号递进 vertical_list -->
  <g id="innovations">
    <!-- chart-plot-area -->
    <!-- 创新一 -->
    <g id="innovation-1">
      <rect x="64" y="206" width="1152" height="128" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="64" y="206" width="6" height="128" fill="#1B3A5B"/>
      <text x="104" y="288" font-family="Cambria, SimSun, serif" font-size="56" font-weight="bold" fill="#1B3A5B" fill-opacity="0.16">01</text>
      <use data-icon="tabler-outline/adjustments" x="196" y="246" width="40" height="40" fill="#1B3A5B"/>
      <text x="264" y="256" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5B">推荐系统参数校准方法</text>
      <text x="264" y="290" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">将推荐抽象为兴趣匹配、内容热度、时间衰减、随机探索等可解释维度，用规则 ABM 拟合真实传播</text>
      <text x="264" y="316" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">结果，通过 EM / Optuna / 贝叶斯优化校准权重——<tspan font-weight="700" fill="#C8A24B">参数由真实传播过程校准而非主观假设</tspan>。</text>
    </g>
    <!-- 创新二 -->
    <g id="innovation-2">
      <rect x="64" y="346" width="1152" height="128" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="64" y="346" width="6" height="128" fill="#C8A24B"/>
      <text x="104" y="428" font-family="Cambria, SimSun, serif" font-size="56" font-weight="bold" fill="#C8A24B" fill-opacity="0.20">02</text>
      <use data-icon="tabler-outline/refresh" x="196" y="386" width="40" height="40" fill="#C8A24B"/>
      <text x="264" y="396" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5B">离线校准—在线仿真全流程闭环</text>
      <text x="264" y="430" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">将推荐权重、时间衰减、行为阈值与实验元数据写入统一 YAML，由在线平台读取驱动推荐服务、</text>
      <text x="264" y="456" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">Agent 决策与实验记录，实现<tspan font-weight="700" fill="#C8A24B">参数自动流转</tspan>，提升可复现性与跨领域复用。</text>
    </g>
    <!-- 创新三 -->
    <g id="innovation-3">
      <rect x="64" y="486" width="1152" height="128" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="64" y="486" width="6" height="128" fill="#4A6B8A"/>
      <text x="104" y="568" font-family="Cambria, SimSun, serif" font-size="56" font-weight="bold" fill="#4A6B8A" fill-opacity="0.20">03</text>
      <use data-icon="tabler-outline/stack" x="196" y="526" width="40" height="40" fill="#4A6B8A"/>
      <text x="264" y="536" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5B">大模型与小模型分层协同架构</text>
      <text x="264" y="570" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">高影响力核心用户由大模型驱动承担原创与复杂行为，普通用户由小模型完成低成本互动，</text>
      <text x="264" y="596" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">在<tspan font-weight="700" fill="#C8A24B">行为保真度、可解释性与运行效率</tspan>间取得平衡。</text>
    </g>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">08</text>
  </g>
</svg>
