<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowTL" cx="0%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#1B3A5B" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#1B3A5B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B3A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="100%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#C8A24B" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#C8A24B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect width="1280" height="720" fill="url(#bgGlowTL)"/>
    <rect width="1280" height="720" fill="url(#bgGlowBR)"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">04 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">技术路线与方案</tspan></text>
    <image href="../images/cuc_logo.png" x="1176" y="36" width="40" height="52" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="148" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">核心模块三：在线模拟与验证方案</text>
    <rect x="64" y="166" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 顶部 fig4 系统架构（放大） -->
  <g id="figure">
    <rect x="64" y="184" width="1152" height="346" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
    <image href="../images/fig4_online.png" x="80" y="194" width="1120" height="326" preserveAspectRatio="xMidYMid meet"/>
    <text x="1208" y="550" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#8C8C82">图 4　在线社交网络模拟系统架构</text>
  </g>

  <!-- 底部左右两栏（压缩为单行带） -->
  <g id="bottom">
    <!-- 在线模拟 -->
    <g id="online-sim">
      <rect x="64" y="560" width="566" height="100" rx="4" fill="#F1ECE3"/>
      <use data-icon="tabler-outline/server" x="86" y="576" width="24" height="24" fill="#4A6B8A"/>
      <text x="120" y="595" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5B">在线社交网络模拟</text>
      <text x="86" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#2B2B2B">main.py 启动 <tspan font-weight="700" fill="#1B3A5B">Backend 与 Agent 双进程</tspan>，Backend</text>
      <text x="86" y="646" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#2B2B2B">负责 Feed 推荐与持久化，Agent 执行决策循环。</text>
    </g>
    <!-- 验证指标 -->
    <g id="validation">
      <rect x="650" y="560" width="566" height="100" rx="4" fill="#1B3A5B"/>
      <rect x="650" y="560" width="6" height="100" fill="#C8A24B"/>
      <use data-icon="tabler-outline/checklist" x="678" y="576" width="24" height="24" fill="#C8A24B"/>
      <text x="712" y="595" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#C8A24B">验证指标</text>
      <text x="678" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#FAF8F4">功能完整性 · 参数一致性（DTW / Pearson）· MAE / MRE</text>
      <text x="678" y="646" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#C8A24B">验证重点：校准参数是否提升拟合程度。</text>
    </g>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">12</text>
  </g>
</svg>
