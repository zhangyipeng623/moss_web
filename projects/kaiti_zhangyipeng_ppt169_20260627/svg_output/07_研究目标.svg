<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowTL" cx="0%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#1B3A5B" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#1B3A5B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B3A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="100%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#C8A24B" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#C8A24B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect width="1280" height="720" fill="url(#bgGlowTL)"/>
    <rect width="1280" height="720" fill="url(#bgGlowBR)"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">03 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">研究目标与创新点</tspan></text>
    <image href="../images/cuc_logo.png" x="1176" y="36" width="40" height="52" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">目标：形成可复现实验闭环</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 总目标引文 -->
  <g id="goal-quote">
    <rect x="64" y="206" width="1152" height="72" rx="4" fill="#F1ECE3"/>
    <rect x="64" y="206" width="6" height="72" fill="#C8A24B"/>
    <text x="100" y="252" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" fill="#2B2B2B">总目标：设计并实现一个<tspan font-weight="700" fill="#1B3A5B">融合推荐机制校准的 MOSS 社交仿真平台</tspan>，形成从真实数据到在线推演的可复现闭环。</text>
  </g>

  <!-- 四目标闭环 circular_stages -->
  <g id="loop">
    <!-- chart-plot-area -->
    <!-- 中心 -->
    <circle cx="640" cy="468" r="62" fill="#1B3A5B"/>
    <use data-icon="tabler-outline/refresh" x="616" y="430" width="48" height="48" fill="#C8A24B"/>
    <text x="640" y="510" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FAF8F4" text-anchor="middle">可复现闭环</text>

    <!-- 环向箭头 -->
    <path d="M 640 360 A 108 108 0 0 1 748 468" fill="none" stroke="#C8A24B" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 748 468 A 108 108 0 0 1 640 576" fill="none" stroke="#C8A24B" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 640 576 A 108 108 0 0 1 532 468" fill="none" stroke="#C8A24B" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 532 468 A 108 108 0 0 1 640 360" fill="none" stroke="#C8A24B" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- 阶段一 画像生成（上） -->
    <g id="stage-1">
      <circle cx="640" cy="338" r="30" fill="#FFFFFF" stroke="#1B3A5B" stroke-width="3"/>
      <use data-icon="tabler-outline/users" x="624" y="322" width="32" height="32" fill="#1B3A5B"/>
      <rect x="448" y="306" width="172" height="64" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <text x="464" y="332" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5B">① 画像生成</text>
      <text x="464" y="356" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5A5A52">稳定 / 行为 / 运行画像</text>
    </g>
    <!-- 阶段二 参数校准（右） -->
    <g id="stage-2">
      <circle cx="770" cy="468" r="30" fill="#FFFFFF" stroke="#C8A24B" stroke-width="3"/>
      <use data-icon="tabler-outline/adjustments" x="754" y="452" width="32" height="32" fill="#C8A24B"/>
      <rect x="812" y="436" width="200" height="64" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <text x="828" y="462" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5B">② 参数校准</text>
      <text x="828" y="486" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5A5A52">权重 / 衰减 / 层级影响</text>
    </g>
    <!-- 阶段三 在线仿真（下） -->
    <g id="stage-3">
      <circle cx="640" cy="598" r="30" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="3"/>
      <use data-icon="tabler-outline/server" x="624" y="582" width="32" height="32" fill="#4A6B8A"/>
      <rect x="660" y="566" width="172" height="64" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <text x="676" y="592" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5B">③ 在线仿真</text>
      <text x="676" y="616" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5A5A52">发帖 / 评论 / 点赞 / 转发</text>
    </g>
    <!-- 阶段四 闭环验证（左） -->
    <g id="stage-4">
      <circle cx="510" cy="468" r="30" fill="#FFFFFF" stroke="#3C7A5A" stroke-width="3"/>
      <use data-icon="tabler-outline/checklist" x="494" y="452" width="32" height="32" fill="#3C7A5A"/>
      <rect x="268" y="436" width="200" height="64" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <text x="284" y="462" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5B">④ 闭环验证</text>
      <text x="284" y="486" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5A5A52">传播曲线 / 态度 / 消融</text>
    </g>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">07</text>
  </g>
</svg>
