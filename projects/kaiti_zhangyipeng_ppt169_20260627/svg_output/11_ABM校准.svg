<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowTL" cx="0%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#1B3A5B" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#1B3A5B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B3A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="100%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#C8A24B" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#C8A24B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect width="1280" height="720" fill="url(#bgGlowTL)"/>
    <rect width="1280" height="720" fill="url(#bgGlowBR)"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">04 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">技术路线与方案</tspan></text>
    <image href="../images/cuc_logo.png" x="1176" y="36" width="40" height="52" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="148" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">核心模块二：ABM 推荐参数校准</text>
    <rect x="64" y="166" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 顶部四维评分 icon_grid -->
  <g id="score-grid">
    <!-- chart-plot-area -->
    <g id="score-1">
      <rect x="64" y="190" width="276" height="96" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <use data-icon="tabler-outline/users" x="84" y="212" width="30" height="30" fill="#1B3A5B"/>
      <text x="126" y="226" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#C8A24B">w_i</text>
      <text x="84" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5B">兴趣匹配</text>
    </g>
    <g id="score-2">
      <rect x="356" y="190" width="276" height="96" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <use data-icon="tabler-outline/flame" x="376" y="212" width="30" height="30" fill="#B24A38"/>
      <text x="418" y="226" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#C8A24B">w_pop</text>
      <text x="376" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5B">内容热度</text>
    </g>
    <g id="score-3">
      <rect x="648" y="190" width="276" height="96" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <use data-icon="tabler-outline/clock" x="668" y="212" width="30" height="30" fill="#4A6B8A"/>
      <text x="710" y="226" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#C8A24B">w_time</text>
      <text x="668" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5B">时间衰减</text>
    </g>
    <g id="score-4">
      <rect x="940" y="190" width="276" height="96" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <use data-icon="tabler-outline/dice" x="960" y="212" width="30" height="30" fill="#3C7A5A"/>
      <text x="1002" y="226" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#C8A24B">w_rand</text>
      <text x="960" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5B">随机探索</text>
    </g>
  </g>

  <!-- 中部 fig3 + 右侧 EM 说明 -->
  <g id="mid">
    <rect x="64" y="302" width="700" height="252" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
    <image href="../images/fig3_abm.png" x="76" y="312" width="676" height="232" preserveAspectRatio="xMidYMid meet"/>
    <text x="752" y="572" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#8C8C82">图 3　ABM 推荐参数校准模块设计</text>

    <!-- EM 说明 -->
    <rect x="780" y="302" width="436" height="252" rx="4" fill="#F1ECE3"/>
    <text x="804" y="338" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B3A5B">EMCalibrationEngine</text>
    <rect x="804" y="358" width="388" height="2" fill="#D8D0C2"/>
    <text x="804" y="392" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B"><tspan font-weight="700" fill="#C8A24B">E 步</tspan>　搜索内容级 p_base</text>
    <text x="804" y="430" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B"><tspan font-weight="700" fill="#C8A24B">M 步</tspan>　Dirichlet 约束下联合搜索</text>
    <text x="804" y="456" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B">　　　推荐权重与 decay_lambda</text>
    <text x="804" y="506" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B">推荐可见概率由四类分数<tspan font-weight="700" fill="#1B3A5B">加权</tspan></text>
    <text x="804" y="532" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B">得到，拟合真实传播结果。</text>
  </g>

  <!-- 底部输出 -->
  <g id="output">
    <rect x="64" y="570" width="1152" height="66" rx="4" fill="#1B3A5B"/>
    <rect x="64" y="570" width="6" height="66" fill="#C8A24B"/>
    <text x="100" y="599" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#C8A24B" letter-spacing="2">输出</text>
    <text x="100" y="623" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#FAF8F4"><tspan font-weight="700" fill="#C8A24B">calibration_profile.yaml</tspan>，供在线 SocialRecSys.configure 直接注入。</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">11</text>
  </g>
</svg>
