<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">总结 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#8C8C82" letter-spacing="3">SUMMARY</tspan></text>
    <image href="../images/cuc_logo.png" x="1188" y="40" width="28" height="36" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 核心论断 -->
  <g id="closing">
    <rect x="320" y="200" width="64" height="5" fill="#C8A24B"/>
    <text x="320" y="288" font-family="Cambria, SimSun, serif" font-size="40" font-weight="bold" fill="#1B3A5B">以推荐机制校准为核心</text>
    <text x="320" y="360" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#2B2B2B">
      <tspan x="320" dy="0">将真实传播数据治理、ABM 参数校准、大小模型分层仿真</tspan>
      <tspan x="320" dy="40">与多指标验证，连接为一个<tspan font-weight="700" fill="#1B3A5B">可复用的社交仿真平台闭环</tspan>。</tspan>
    </text>
  </g>

  <!-- 三个预期贡献标签 -->
  <g id="contributions">
    <text x="320" y="476" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#C8A24B" letter-spacing="2">预期贡献</text>
    <!-- 标签一 -->
    <g id="tag-1">
      <rect x="320" y="496" width="270" height="84" rx="4" fill="#F1ECE3"/>
      <rect x="320" y="496" width="6" height="84" fill="#1B3A5B"/>
      <use data-icon="tabler-outline/database" x="348" y="520" width="32" height="32" fill="#1B3A5B"/>
      <text x="392" y="546" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B3A5B">现实参照</text>
    </g>
    <!-- 标签二 -->
    <g id="tag-2">
      <rect x="610" y="496" width="270" height="84" rx="4" fill="#F1ECE3"/>
      <rect x="610" y="496" width="6" height="84" fill="#C8A24B"/>
      <use data-icon="tabler-outline/settings" x="638" y="520" width="32" height="32" fill="#C8A24B"/>
      <text x="682" y="546" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B3A5B">机制解释力</text>
    </g>
    <!-- 标签三 -->
    <g id="tag-3">
      <rect x="900" y="496" width="270" height="84" rx="4" fill="#F1ECE3"/>
      <rect x="900" y="496" width="6" height="84" fill="#4A6B8A"/>
      <use data-icon="tabler-outline/stack" x="928" y="520" width="32" height="32" fill="#4A6B8A"/>
      <text x="972" y="546" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B3A5B">跨议题复用</text>
    </g>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">15</text>
  </g>
</svg>
