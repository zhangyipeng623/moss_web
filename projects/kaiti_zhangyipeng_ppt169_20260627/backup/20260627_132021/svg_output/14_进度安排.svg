<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">06 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">进度安排</tspan></text>
    <image href="../images/cuc_logo.png" x="1188" y="40" width="28" height="36" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">进度安排：2026 年 6 月至 12 月</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 水平时间轴 timeline -->
  <g id="timeline">
    <!-- chart-plot-area -->
    <!-- 轴线 -->
    <line x1="140" y1="408" x2="1140" y2="408" stroke="#D8D0C2" stroke-width="4" stroke-linecap="round"/>

    <!-- 节点一 6-7月（上） -->
    <g id="node-1">
      <circle cx="140" cy="408" r="14" fill="#1B3A5B"/>
      <circle cx="140" cy="408" r="6" fill="#C8A24B"/>
      <line x1="140" y1="394" x2="140" y2="360" stroke="#D8D0C2" stroke-width="1.5"/>
      <rect x="56" y="240" width="168" height="120" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="56" y="240" width="168" height="34" rx="4" fill="#1B3A5B"/>
      <rect x="56" y="262" width="168" height="12" fill="#1B3A5B"/>
      <text x="140" y="263" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="700" fill="#FAF8F4" text-anchor="middle">6-7 月</text>
      <text x="140" y="304" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">需求分析</text>
      <text x="140" y="328" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">与总体方案</text>
    </g>
    <!-- 节点二 7-8月（下） -->
    <g id="node-2">
      <circle cx="340" cy="408" r="14" fill="#1B3A5B"/>
      <circle cx="340" cy="408" r="6" fill="#C8A24B"/>
      <line x1="340" y1="422" x2="340" y2="456" stroke="#D8D0C2" stroke-width="1.5"/>
      <rect x="256" y="456" width="168" height="120" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="256" y="456" width="168" height="34" rx="4" fill="#4A6B8A"/>
      <rect x="256" y="478" width="168" height="12" fill="#4A6B8A"/>
      <text x="340" y="479" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="700" fill="#FAF8F4" text-anchor="middle">7-8 月</text>
      <text x="340" y="520" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">数据准备</text>
      <text x="340" y="544" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">与画像模块</text>
    </g>
    <!-- 节点三 8-9月（上） -->
    <g id="node-3">
      <circle cx="540" cy="408" r="14" fill="#1B3A5B"/>
      <circle cx="540" cy="408" r="6" fill="#C8A24B"/>
      <line x1="540" y1="394" x2="540" y2="360" stroke="#D8D0C2" stroke-width="1.5"/>
      <rect x="456" y="240" width="168" height="120" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="456" y="240" width="168" height="34" rx="4" fill="#1B3A5B"/>
      <rect x="456" y="262" width="168" height="12" fill="#1B3A5B"/>
      <text x="540" y="263" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="700" fill="#FAF8F4" text-anchor="middle">8-9 月</text>
      <text x="540" y="304" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">ABM 参数校准</text>
      <text x="540" y="328" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">初步实验</text>
    </g>
    <!-- 节点四 9-10月（下） -->
    <g id="node-4">
      <circle cx="740" cy="408" r="14" fill="#1B3A5B"/>
      <circle cx="740" cy="408" r="6" fill="#C8A24B"/>
      <line x1="740" y1="422" x2="740" y2="456" stroke="#D8D0C2" stroke-width="1.5"/>
      <rect x="656" y="456" width="168" height="120" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="656" y="456" width="168" height="34" rx="4" fill="#4A6B8A"/>
      <rect x="656" y="478" width="168" height="12" fill="#4A6B8A"/>
      <text x="740" y="479" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="700" fill="#FAF8F4" text-anchor="middle">9-10 月</text>
      <text x="740" y="520" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">在线模拟系统</text>
      <text x="740" y="544" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">开发联调</text>
    </g>
    <!-- 节点五 10-11月（上） -->
    <g id="node-5">
      <circle cx="940" cy="408" r="14" fill="#1B3A5B"/>
      <circle cx="940" cy="408" r="6" fill="#C8A24B"/>
      <line x1="940" y1="394" x2="940" y2="360" stroke="#D8D0C2" stroke-width="1.5"/>
      <rect x="856" y="240" width="168" height="120" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="856" y="240" width="168" height="34" rx="4" fill="#1B3A5B"/>
      <rect x="856" y="262" width="168" height="12" fill="#1B3A5B"/>
      <text x="940" y="263" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="700" fill="#FAF8F4" text-anchor="middle">10-11 月</text>
      <text x="940" y="304" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">系统实验</text>
      <text x="940" y="328" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B" text-anchor="middle">与结果分析</text>
    </g>
    <!-- 节点六 11-12月（下） -->
    <g id="node-6">
      <circle cx="1140" cy="408" r="16" fill="#C8A24B"/>
      <circle cx="1140" cy="408" r="7" fill="#1B3A5B"/>
      <line x1="1140" y1="424" x2="1140" y2="456" stroke="#C8A24B" stroke-width="1.5"/>
      <rect x="1056" y="456" width="168" height="120" rx="4" fill="#1B3A5B"/>
      <rect x="1056" y="456" width="168" height="34" rx="4" fill="#C8A24B"/>
      <rect x="1056" y="478" width="168" height="12" fill="#C8A24B"/>
      <text x="1140" y="479" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5B" text-anchor="middle">11-12 月</text>
      <text x="1140" y="520" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#FAF8F4" text-anchor="middle">系统优化</text>
      <text x="1140" y="544" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#FAF8F4" text-anchor="middle">论文与答辩</text>
    </g>
  </g>

  <!-- 底部论断 -->
  <g id="assertion">
    <rect x="64" y="600" width="1152" height="60" rx="4" fill="#F1ECE3"/>
    <rect x="64" y="600" width="6" height="60" fill="#C8A24B"/>
    <text x="100" y="637" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#2B2B2B">节奏遵循<tspan font-weight="700" fill="#1B3A5B">「先闭环、再优化、再实验」</tspan>，确保论文写作有稳定系统与实验结果支撑。</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">14</text>
  </g>
</svg>
