<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">05 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">可行性分析</tspan></text>
    <image href="../images/cuc_logo.png" x="1188" y="40" width="28" height="36" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">理论、方法、工程基础均具备</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 四象限卡 -->
  <g id="quadrants">
    <!-- 理论基础 -->
    <g id="q-theory">
      <rect x="64" y="212" width="566" height="194" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="64" y="212" width="6" height="194" fill="#1B3A5B"/>
      <use data-icon="tabler-outline/bulb" x="92" y="238" width="32" height="32" fill="#1B3A5B"/>
      <text x="136" y="262" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B3A5B">理论基础</text>
      <text x="92" y="316" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">HiSim、FDE-LLM、OASIS 等研究</text>
      <text x="92" y="344" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">证明混合仿真与平台化系统可行。</text>
    </g>
    <!-- 方法基础 -->
    <g id="q-method">
      <rect x="650" y="212" width="566" height="194" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="650" y="212" width="6" height="194" fill="#C8A24B"/>
      <use data-icon="tabler-outline/adjustments" x="678" y="238" width="32" height="32" fill="#C8A24B"/>
      <text x="722" y="262" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B3A5B">方法基础</text>
      <text x="678" y="316" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">EM、Optuna、贝叶斯优化与奖励</text>
      <text x="678" y="344" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">建模研究可迁移到推荐参数估计。</text>
    </g>
    <!-- 数据与画像基础 -->
    <g id="q-data">
      <rect x="64" y="424" width="566" height="194" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="64" y="424" width="6" height="194" fill="#4A6B8A"/>
      <use data-icon="tabler-outline/users" x="92" y="450" width="32" height="32" fill="#4A6B8A"/>
      <text x="136" y="474" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B3A5B">数据与画像基础</text>
      <text x="92" y="528" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">用户画像生成与分层建模已有</text>
      <text x="92" y="556" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">Two-stage Profiling、TWICE 支撑。</text>
    </g>
    <!-- 工程基础 -->
    <g id="q-engineering">
      <rect x="650" y="424" width="566" height="194" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="650" y="424" width="6" height="194" fill="#3C7A5A"/>
      <use data-icon="tabler-outline/server" x="678" y="450" width="32" height="32" fill="#3C7A5A"/>
      <text x="722" y="474" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B3A5B">工程基础</text>
      <text x="678" y="528" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">FastAPI、SQLite、向量检索与</text>
      <text x="678" y="556" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">LangChain 等工具链可支撑实现。</text>
    </g>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">13</text>
  </g>
</svg>
