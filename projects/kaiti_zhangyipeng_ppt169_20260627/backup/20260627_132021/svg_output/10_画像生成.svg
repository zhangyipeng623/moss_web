<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">04 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">技术路线与方案</tspan></text>
    <image href="../images/cuc_logo.png" x="1188" y="40" width="28" height="36" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">核心模块一：用户画像生成</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 左侧文字 -->
  <g id="text-col">
    <!-- 输入与特征 -->
    <use data-icon="tabler-outline/database" x="64" y="210" width="28" height="28" fill="#4A6B8A"/>
    <text x="104" y="232" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B3A5B">输入与特征</text>
    <text x="64" y="268" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B">user/post 原始数据；发帖、互动、活跃时段、</text>
    <text x="64" y="290" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B">粉丝数；帖子与账号影响力指标；证据帖筛选。</text>

    <!-- 五阶段流水线 -->
    <use data-icon="tabler-outline/robot" x="64" y="324" width="28" height="28" fill="#C8A24B"/>
    <text x="104" y="346" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B3A5B">五阶段 LLM 流水线</text>

    <g id="pipeline">
      <rect x="64" y="368" width="486" height="40" rx="4" fill="#F1ECE3"/>
      <text x="84" y="394" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B"><tspan font-weight="700" fill="#1B3A5B">A</tspan>　证据抽取</text>
      <rect x="64" y="416" width="486" height="40" rx="4" fill="#F1ECE3"/>
      <text x="84" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B"><tspan font-weight="700" fill="#1B3A5B">B</tspan>　稳定画像</text>
      <rect x="64" y="464" width="486" height="40" rx="4" fill="#F1ECE3"/>
      <text x="84" y="490" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B"><tspan font-weight="700" fill="#1B3A5B">C</tspan>　行为画像</text>
      <rect x="64" y="512" width="486" height="40" rx="4" fill="#F1ECE3"/>
      <text x="84" y="538" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B"><tspan font-weight="700" fill="#1B3A5B">D</tspan>　Agent 画像压缩</text>
      <rect x="64" y="560" width="486" height="40" rx="4" fill="#F1ECE3"/>
      <text x="84" y="586" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#2B2B2B"><tspan font-weight="700" fill="#1B3A5B">E</tspan>　模拟初始状态</text>
    </g>
  </g>

  <!-- 右侧图 fig2 -->
  <g id="figure">
    <rect x="582" y="210" width="634" height="330" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
    <image href="../images/fig2_portrait.png" x="596" y="222" width="606" height="306" preserveAspectRatio="xMidYMid meet"/>
    <text x="1202" y="560" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#8C8C82">图 2　用户画像生成模块设计</text>
  </g>

  <!-- 右下成本控制 -->
  <g id="cost">
    <rect x="582" y="572" width="634" height="64" rx="4" fill="#1B3A5B"/>
    <rect x="582" y="572" width="6" height="64" fill="#C8A24B"/>
    <text x="612" y="600" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#C8A24B" letter-spacing="2">成本控制 · 影响力分层</text>
    <text x="612" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FAF8F4">L4-L5 高影响力用完整流水线；L1-L3 用 simple profile mode 与行为库。</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">10</text>
  </g>
</svg>
