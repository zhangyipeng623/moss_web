<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowTL" cx="0%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#1B3A5B" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#1B3A5B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B3A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="100%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#C8A24B" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#C8A24B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect width="1280" height="720" fill="url(#bgGlowTL)"/>
    <rect width="1280" height="720" fill="url(#bgGlowBR)"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">04 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">技术路线与方案</tspan></text>
    <image href="../images/cuc_logo.png" x="1176" y="36" width="40" height="52" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">数据流转时序：从离线数据到在线归档</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 数据流转时序图 fig5 -->
  <g id="figure">
    <rect x="64" y="200" width="1152" height="356" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
    <image href="../images/fig5_dataflow.png" x="80" y="212" width="1120" height="332" preserveAspectRatio="xMidYMid meet"/>
    <text x="1208" y="576" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#8C8C82">图 5　数据流转时序：离线数据 → 配置中枢 → 在线归档</text>
  </g>

  <!-- 底部论断 -->
  <g id="assertion">
    <rect x="64" y="568" width="1152" height="68" rx="4" fill="#1B3A5B"/>
    <rect x="64" y="568" width="6" height="68" fill="#C8A24B"/>
    <text x="100" y="600" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#C8A24B" letter-spacing="2">参数自动流转</text>
    <text x="100" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#FAF8F4">离线产出 <tspan font-weight="700" fill="#C8A24B">portraits/*.json</tspan> 与校准参数写入 YAML，在线运行结果回流校准，形成可复现迭代闭环。</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">13</text>
  </g>
</svg>
