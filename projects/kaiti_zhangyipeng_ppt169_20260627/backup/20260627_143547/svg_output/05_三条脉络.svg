<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowTL" cx="0%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#1B3A5B" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#1B3A5B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B3A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="100%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#C8A24B" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#C8A24B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect width="1280" height="720" fill="url(#bgGlowTL)"/>
    <rect width="1280" height="720" fill="url(#bgGlowBR)"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">02 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">国内外研究现状</tspan></text>
    <image href="../images/cuc_logo.png" x="1176" y="36" width="40" height="52" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">三条相关脉络</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 三栏并列 vertical_pillars -->
  <g id="pillars">
    <!-- chart-plot-area -->
    <!-- 脉络一 规则 ABM -->
    <g id="pillar-1">
      <rect x="64" y="206" width="362" height="316" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="64" y="206" width="362" height="64" rx="4" fill="#1B3A5B"/>
      <rect x="64" y="250" width="362" height="20" fill="#1B3A5B"/>
      <use data-icon="tabler-outline/math-function" x="88" y="222" width="32" height="32" fill="#FAF8F4"/>
      <text x="132" y="247" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FAF8F4">规则 ABM 与传播动力学</text>
      <text x="92" y="312" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">
        <tspan x="92" dy="0">Bounded Confidence、SIR、</tspan>
        <tspan x="92" dy="28">Hawkes、元胞自动机等模型。</tspan>
      </text>
      <text x="92" y="392" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#3C7A5A">✓ 成本低、可解释</text>
      <text x="92" y="424" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#B24A38">
        <tspan x="92" dy="0">弱在文本生成与</tspan>
        <tspan x="92" dy="26">个体行为解释。</tspan>
      </text>
    </g>
    <!-- 脉络二 LLM Agent -->
    <g id="pillar-2">
      <rect x="459" y="206" width="362" height="316" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="459" y="206" width="362" height="64" rx="4" fill="#C8A24B"/>
      <rect x="459" y="250" width="362" height="20" fill="#C8A24B"/>
      <use data-icon="tabler-outline/robot" x="483" y="222" width="32" height="32" fill="#FFFFFF"/>
      <text x="527" y="247" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">LLM Agent 与混合仿真</text>
      <text x="487" y="312" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">
        <tspan x="487" dy="0">Generative Agents、HiSim、</tspan>
        <tspan x="487" dy="28">FDE-LLM、GASim、TopoSim、APS。</tspan>
      </text>
      <text x="487" y="392" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#3C7A5A">
        <tspan x="487" dy="0">✓ 推动画像、记忆、信念</tspan>
        <tspan x="487" dy="26">与混合架构。</tspan>
      </text>
    </g>
    <!-- 脉络三 平台化推荐 -->
    <g id="pillar-3">
      <rect x="854" y="206" width="362" height="316" rx="4" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="1"/>
      <rect x="854" y="206" width="362" height="64" rx="4" fill="#4A6B8A"/>
      <rect x="854" y="250" width="362" height="20" fill="#4A6B8A"/>
      <use data-icon="tabler-outline/server" x="878" y="222" width="32" height="32" fill="#FFFFFF"/>
      <text x="922" y="247" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">平台化系统与推荐机制</text>
      <text x="882" y="312" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">
        <tspan x="882" dy="0">OASIS、GGBond、POSIM、</tspan>
        <tspan x="882" dy="28">PolicySim 纳入平台环境与排序。</tspan>
      </text>
      <text x="882" y="392" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#B24A38">
        <tspan x="882" dy="0">参数多依赖预设或</tspan>
        <tspan x="882" dy="26">离线调参。</tspan>
      </text>
    </g>
  </g>

  <!-- 底部论断 -->
  <g id="assertion">
    <rect x="64" y="544" width="1152" height="92" rx="4" fill="#1B3A5B"/>
    <rect x="64" y="544" width="6" height="92" fill="#C8A24B"/>
    <text x="100" y="580" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#C8A24B" letter-spacing="2">研究空白</text>
    <text x="100" y="614" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#FAF8F4">研究基础充分，但<tspan font-weight="700" fill="#C8A24B">「真实传播数据 → 推荐参数校准 → 在线仿真注入」</tspan>的链条仍不完整。</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">05</text>
  </g>
</svg>
