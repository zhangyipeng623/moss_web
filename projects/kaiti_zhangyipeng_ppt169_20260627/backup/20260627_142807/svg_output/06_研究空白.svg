<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">02 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">国内外研究现状</tspan></text>
    <image href="../images/cuc_logo.png" x="1188" y="40" width="28" height="36" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">研究空白：推荐机制缺少实证校准</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 左右对照 -->
  <g id="comparison">
    <!-- 左：已有做法 -->
    <g id="existing">
      <rect x="64" y="206" width="560" height="334" rx="4" fill="#F1ECE3"/>
      <use data-icon="tabler-outline/puzzle" x="92" y="230" width="30" height="30" fill="#B24A38"/>
      <text x="132" y="254" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#B24A38">已有系统的常见做法</text>

      <circle cx="100" cy="312" r="4" fill="#5A5A52"/>
      <text x="116" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">无显式推荐模块——邻居传播、时间线或</text>
      <text x="116" y="344" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">随机曝光。</text>

      <circle cx="100" cy="392" r="4" fill="#5A5A52"/>
      <text x="116" y="398" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">有推荐模块者用兴趣公式、hot-score、</text>
      <text x="116" y="424" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">人工权重或离线调参。</text>

      <circle cx="100" cy="472" r="4" fill="#5A5A52"/>
      <text x="116" y="478" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">政策优化类工作更关注干预效果。</text>
    </g>

    <!-- 箭头 -->
    <g id="arrow">
      <line x1="638" y1="373" x2="688" y2="373" stroke="#C8A24B" stroke-width="3"/>
      <path d="M 680 365 L 690 373 L 680 381" fill="none" stroke="#C8A24B" stroke-width="3"/>
    </g>

    <!-- 右：本课题拟解决 -->
    <g id="solution">
      <rect x="702" y="206" width="514" height="334" rx="4" fill="#1B3A5B"/>
      <rect x="702" y="206" width="6" height="334" fill="#C8A24B"/>
      <use data-icon="tabler-outline/target" x="730" y="230" width="30" height="30" fill="#C8A24B"/>
      <text x="770" y="254" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#C8A24B">本课题拟解决</text>

      <circle cx="740" cy="312" r="4" fill="#C8A24B"/>
      <text x="756" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#FAF8F4">将推荐评分拆解为可解释维度。</text>

      <circle cx="740" cy="372" r="4" fill="#C8A24B"/>
      <text x="756" y="378" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#FAF8F4">用真实传播结果<tspan font-weight="700" fill="#C8A24B">拟合校准</tspan>参数。</text>

      <circle cx="740" cy="432" r="4" fill="#C8A24B"/>
      <text x="756" y="438" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#FAF8F4">把校准参数写入 YAML 并驱动</text>
      <text x="756" y="464" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#FAF8F4">在线 Feed 排序。</text>
    </g>
  </g>

  <!-- 底部论断 -->
  <g id="assertion">
    <rect x="64" y="568" width="1152" height="68" rx="4" fill="#F1ECE3"/>
    <rect x="64" y="568" width="6" height="68" fill="#C8A24B"/>
    <text x="100" y="610" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5B">从主观预设 <tspan fill="#C8A24B">→</tspan> 数据校准。</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">06</text>
  </g>
</svg>
