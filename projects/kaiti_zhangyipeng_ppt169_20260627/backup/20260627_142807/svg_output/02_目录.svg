<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">目录 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#8C8C82" letter-spacing="3">CONTENTS</tspan></text>
    <image href="../images/cuc_logo.png" x="1188" y="40" width="28" height="36" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 左侧大字 -->
  <g id="toc-hero">
    <text x="64" y="280" font-family="Cambria, SimSun, serif" font-size="120" font-weight="bold" fill="#1B3A5B" fill-opacity="0.10">06</text>
    <text x="64" y="350" font-family="Cambria, SimSun, serif" font-size="46" font-weight="bold" fill="#1B3A5B">汇报结构</text>
    <rect x="66" y="372" width="56" height="4" fill="#C8A24B"/>
    <text x="64" y="420" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#5A5A52">围绕一个核心问题</text>
    <text x="64" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#5A5A52">分六章逐层展开</text>

    <!-- 核心问题引文块 -->
    <rect x="64" y="500" width="430" height="150" rx="4" fill="#F1ECE3"/>
    <rect x="64" y="500" width="5" height="150" fill="#C8A24B"/>
    <text x="92" y="538" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#C8A24B" letter-spacing="2">核心问题</text>
    <text x="92" y="572" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#2B2B2B">
      <tspan x="92" dy="0">如何从真实传播数据<tspan font-weight="700" fill="#1B3A5B">校准</tspan>推荐机制参数，</tspan>
      <tspan x="92" dy="28">并注入 LLM Agent 与规则 Agent</tspan>
      <tspan x="92" dy="28">协同运行的社交仿真平台？</tspan>
    </text>
  </g>

  <!-- 右侧章节列表 -->
  <g id="toc-list">
    <!-- 01 -->
    <g id="toc-item-1">
      <text x="560" y="180" font-family="Cambria, SimSun, serif" font-size="30" font-weight="bold" fill="#C8A24B">01</text>
      <text x="624" y="180" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B3A5B">选题背景与研究意义</text>
      <line x1="560" y1="204" x2="1216" y2="204" stroke="#D8D0C2" stroke-width="1"/>
    </g>
    <g id="toc-item-2">
      <text x="560" y="258" font-family="Cambria, SimSun, serif" font-size="30" font-weight="bold" fill="#C8A24B">02</text>
      <text x="624" y="258" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B3A5B">国内外研究现状</text>
      <line x1="560" y1="282" x2="1216" y2="282" stroke="#D8D0C2" stroke-width="1"/>
    </g>
    <g id="toc-item-3">
      <text x="560" y="336" font-family="Cambria, SimSun, serif" font-size="30" font-weight="bold" fill="#C8A24B">03</text>
      <text x="624" y="336" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B3A5B">研究目标与创新点</text>
      <line x1="560" y1="360" x2="1216" y2="360" stroke="#D8D0C2" stroke-width="1"/>
    </g>
    <g id="toc-item-4">
      <text x="560" y="414" font-family="Cambria, SimSun, serif" font-size="30" font-weight="bold" fill="#C8A24B">04</text>
      <text x="624" y="414" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B3A5B">技术路线与方案</text>
      <line x1="560" y1="438" x2="1216" y2="438" stroke="#D8D0C2" stroke-width="1"/>
    </g>
    <g id="toc-item-5">
      <text x="560" y="492" font-family="Cambria, SimSun, serif" font-size="30" font-weight="bold" fill="#C8A24B">05</text>
      <text x="624" y="492" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B3A5B">可行性分析</text>
      <line x1="560" y1="516" x2="1216" y2="516" stroke="#D8D0C2" stroke-width="1"/>
    </g>
    <g id="toc-item-6">
      <text x="560" y="570" font-family="Cambria, SimSun, serif" font-size="30" font-weight="bold" fill="#C8A24B">06</text>
      <text x="624" y="570" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B3A5B">进度安排</text>
      <line x1="560" y1="594" x2="1216" y2="594" stroke="#D8D0C2" stroke-width="1"/>
    </g>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">02</text>
  </g>
</svg>
