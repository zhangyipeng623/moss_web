<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowTL" cx="0%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#1B3A5B" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#1B3A5B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1B3A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="100%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#C8A24B" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#C8A24B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C8A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect width="1280" height="720" fill="url(#bgGlowTL)"/>
    <rect width="1280" height="720" fill="url(#bgGlowBR)"/>
  </g>

  <!-- 页眉 -->
  <g id="header">
    <text x="64" y="72" font-family="Cambria, SimSun, serif" font-size="20" font-weight="bold" fill="#1B3A5B">01 <tspan font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5A5A52">选题背景与研究意义</tspan></text>
    <image href="../images/cuc_logo.png" x="1176" y="36" width="40" height="52" preserveAspectRatio="xMidYMid meet"/>
    <line x1="64" y1="96" x2="1216" y2="96" stroke="#1B3A5B" stroke-width="2"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="156" font-family="Cambria, SimSun, serif" font-size="34" font-weight="bold" fill="#1B3A5B">研究意义：推荐机制成为内生变量</text>
    <rect x="64" y="174" width="56" height="4" fill="#C8A24B"/>
  </g>

  <!-- 三栏卡 -->
  <g id="cards">
    <!-- 理论意义 -->
    <g id="card-theory">
      <rect x="64" y="212" width="362" height="288" rx="4" fill="#F1ECE3"/>
      <rect x="64" y="212" width="362" height="6" fill="#1B3A5B"/>
      <use data-icon="tabler-outline/scale" x="92" y="248" width="36" height="36" fill="#1B3A5B"/>
      <text x="92" y="320" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5B">理论意义</text>
      <text x="92" y="360" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">
        <tspan x="92" dy="0">把推荐曝光从平台背景</tspan>
        <tspan x="92" dy="28">提升为传播过程中的</tspan>
        <tspan x="92" dy="28"><tspan font-weight="700" fill="#1B3A5B">机制变量</tspan>，解释信息扩散</tspan>
        <tspan x="92" dy="28">与态度演化的形成链条。</tspan>
      </text>
    </g>
    <!-- 方法意义 -->
    <g id="card-method">
      <rect x="459" y="212" width="362" height="288" rx="4" fill="#F1ECE3"/>
      <rect x="459" y="212" width="362" height="6" fill="#C8A24B"/>
      <use data-icon="tabler-outline/adjustments" x="487" y="248" width="36" height="36" fill="#C8A24B"/>
      <text x="487" y="320" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5B">方法意义</text>
      <text x="487" y="360" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">
        <tspan x="487" dy="0">以真实传播结果<tspan font-weight="700" fill="#1B3A5B">校准</tspan></tspan>
        <tspan x="487" dy="28">兴趣匹配、内容热度、</tspan>
        <tspan x="487" dy="28">时间衰减与随机探索</tspan>
        <tspan x="487" dy="28">等推荐参数。</tspan>
      </text>
    </g>
    <!-- 工程意义 -->
    <g id="card-engineering">
      <rect x="854" y="212" width="362" height="288" rx="4" fill="#F1ECE3"/>
      <rect x="854" y="212" width="362" height="6" fill="#4A6B8A"/>
      <use data-icon="tabler-outline/server" x="882" y="248" width="36" height="36" fill="#4A6B8A"/>
      <text x="882" y="320" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5B">工程意义</text>
      <text x="882" y="360" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#2B2B2B">
        <tspan x="882" dy="0">形成「数据治理 — 参数</tspan>
        <tspan x="882" dy="28">校准 — 配置注入 — 在线</tspan>
        <tspan x="882" dy="28">仿真 — 结果归档」的</tspan>
        <tspan x="882" dy="28">平台<tspan font-weight="700" fill="#1B3A5B">闭环</tspan>。</tspan>
      </text>
    </g>
  </g>

  <!-- 底部关键转向论断 -->
  <g id="assertion">
    <rect x="64" y="540" width="1152" height="96" rx="4" fill="#1B3A5B"/>
    <rect x="64" y="540" width="6" height="96" fill="#C8A24B"/>
    <text x="100" y="578" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#C8A24B" letter-spacing="2">关键转向</text>
    <text x="100" y="612" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#FAF8F4">推荐参数不再由研究者主观设定，而是<tspan font-weight="700" fill="#C8A24B">由真实传播数据校准</tspan>后进入在线仿真。</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <line x1="64" y1="684" x2="1216" y2="684" stroke="#D8D0C2" stroke-width="1"/>
    <text x="64" y="704" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82">融合推荐机制校准的社交仿真平台</text>
    <text x="1216" y="704" text-anchor="end" font-family="Cambria, SimSun, serif" font-size="12" fill="#8C8C82">04</text>
  </g>
</svg>
