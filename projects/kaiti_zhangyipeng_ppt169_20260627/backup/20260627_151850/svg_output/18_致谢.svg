<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FAF8F4"/>
    <rect x="0" y="0" width="1280" height="6" fill="#1B3A5B"/>
  </g>

  <!-- 校徽 -->
  <g id="emblem">
    <image href="../images/cuc_logo.png" x="585" y="180" width="110" height="140" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- 致谢主字 -->
  <g id="thanks">
    <text x="640" y="430" font-family="Cambria, SimSun, serif" font-size="72" font-weight="bold" fill="#1B3A5B" text-anchor="middle">谢谢</text>
    <rect x="592" y="456" width="96" height="4" fill="#C8A24B"/>
    <text x="640" y="512" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#5A5A52" text-anchor="middle">谢谢各位老师，请批评指正</text>
  </g>

  <!-- 信息 -->
  <g id="info">
    <line x1="490" y1="572" x2="790" y2="572" stroke="#D8D0C2" stroke-width="1"/>
    <text x="640" y="606" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#8C8C82" text-anchor="middle">汇报人　张艺鹏　·　2026 年 6 月　·　中国传媒大学</text>
  </g>

  <!-- 页脚 -->
  <g id="footer">
    <text x="640" y="688" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#8C8C82" text-anchor="middle">融合推荐机制校准的社交仿真平台设计与实现</text>
  </g>
</svg>
